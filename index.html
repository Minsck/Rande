<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Půjdeš se mnou na rande?</title>
<meta name="theme-color" content="#ffd6e3">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ===== Barvy – změň tady ===== */
  :root {
    --sky-top: #ffd6e3; --sky-bottom: #fff3e6;
    --card: rgba(255,255,255,.82); --text: #4a2335; --sub: #8a5a6e;
    --primary: #ff4f8b; --primary-dark: #e23a74; --on-primary: #fff;
    --no: #b9a3ad; --line: #ffd0de; --chip: #fff; --chip-on: #ffe3ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); overflow-x: hidden;
    font: 17px/1.5 "Nunito", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)) fixed;
  }
  /* Vlastní pozadí: stačí do složky nahrát pozadi.jpg (načte se samo) */
  body.custom-bg { background: url("pozadi.jpg") center / cover fixed; }
  body.custom-bg #scene { display: none; }

  /* ===== Scéna na pozadí ===== */
  #scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  #park { position: absolute; left: 0; bottom: 0; width: 100%; height: 42vh; min-height: 220px; }
  .cloud { position: absolute; font-size: 64px; opacity: .9; animation: drift 60s linear infinite; }
  .float-heart { position: absolute; bottom: -40px; animation: rise linear forwards; opacity: .85; }
  @keyframes rise { to { transform: translateY(-110vh) rotate(25deg); opacity: 0; } }
  @keyframes drift { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }

  /* ===== Obrazovky ===== */
  .screen {
    position: relative; z-index: 1; display: none;
    min-height: 100dvh; padding: 24px 16px 120px;
    flex-direction: column; align-items: center; justify-content: center;
  }
  .screen.active { display: flex; animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } }
  .card {
    width: 100%; max-width: 720px; background: var(--card);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 28px; padding: 28px 22px; text-align: center;
    box-shadow: 0 12px 40px rgba(226,58,116,.18);
  }
  h1, h2 { font-family: "Dancing Script", cursive; font-weight: 700; margin: 0 0 18px; line-height: 1.15; }
  h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); }
  h2 { font-size: clamp(1.9rem, 6vw, 2.8rem); }
  .dog { width: 130px; height: 150px; display: block; margin: 0 auto 6px; }

  button { font: inherit; cursor: pointer; border: 0; }
  .btn {
    border-radius: 999px; padding: .6em 1.6em; font-weight: 800; white-space: nowrap;
    background: var(--primary); color: var(--on-primary);
    box-shadow: 0 6px 18px rgba(255,79,139,.35); transition: transform .15s, background .2s, opacity .2s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn.ghost { background: #fff; color: var(--primary); box-shadow: 0 4px 14px rgba(0,0,0,.08); }

  /* 1) Otázka */
  .answers { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; align-items: center; min-height: 90px; }
  #yes { font-size: 1.25rem; transition: font-size .3s ease; }
  #no  { font-size: 1.25rem; background: var(--no); box-shadow: none;
         transition: left .35s ease, top .35s ease, transform .35s ease, opacity .35s; z-index: 5; }
  #no.moving { position: fixed; }
  #no.gone { transform: scale(0) !important; opacity: 0; }

  /* 2) Aktivity */
  .options { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 6px; }
  .opt {
    position: relative; background: var(--chip); border: 2px solid var(--line); border-radius: 18px;
    padding: 14px 10px; font-weight: 700; color: var(--text); min-height: 92px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform .15s, border-color .2s, background .2s;
  }
  .opt .e { font-size: 1.9rem; line-height: 1; }
  .opt:hover { transform: translateY(-2px); }
  .opt.on { background: var(--chip-on); border-color: var(--primary); }
  .opt.on::after { content: "💗"; position: absolute; top: 6px; right: 8px; font-size: .9rem; }
  .opt .del { position: absolute; top: 4px; left: 8px; color: var(--sub); font-size: 1.1rem; background: none; padding: 2px; }
  .opt.add { border-style: dashed; color: var(--sub); }
  .opt.add input {
    width: 100%; font: inherit; font-weight: 700; color: var(--text); text-align: center;
    border: 0; border-bottom: 2px solid var(--primary); background: transparent; outline: none; padding: 4px;
  }
  .opt.add .ok { margin-top: 6px; font-size: .9rem; padding: .3em 1em; }

  /* 3) Datum */
  .date-grid { display: grid; gap: 18px; text-align: left; }
  @media (min-width: 700px) { .date-grid { grid-template-columns: 1fr 1fr; } }
  .cal { background: #fff; border-radius: 20px; padding: 14px; border: 2px solid var(--line); }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 800; text-transform: capitalize; }
  .cal-head button { background: none; font-size: 1.4rem; color: var(--primary); width: 40px; height: 40px; border-radius: 50%; }
  .cal-head button:disabled { opacity: .25; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .wd { font-size: .75rem; font-weight: 800; color: var(--sub); padding: 4px 0; }
  .day { aspect-ratio: 1; border-radius: 50%; background: none; font-weight: 700; color: var(--text); }
  .day:hover:not(:disabled) { background: var(--chip-on); }
  .day:disabled { opacity: .3; cursor: default; }
  .day.today { box-shadow: inset 0 0 0 2px var(--line); }
  .day.sel, .day.sel:hover { background: var(--primary); color: #fff; }
  label.note { display: flex; flex-direction: column; gap: 8px; font-weight: 800; }
  textarea {
    flex: 1; min-height: 160px; resize: vertical; font: inherit; color: var(--text);
    border: 2px solid var(--line); border-radius: 20px; padding: 14px; background: #fff; outline: none;
  }
  textarea:focus { border-color: var(--primary); }
  .hint { color: var(--sub); font-size: .9rem; margin: 12px 0 0; min-height: 1.4em; text-align: center; }

  /* Spodní lišta */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: flex; justify-content: space-between; gap: 12px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .bar .spacer { flex: 1; }

  /* 4) Shrnutí */
  .summary { list-style: none; padding: 0; margin: 0 auto; max-width: 440px; text-align: left; }
  .summary li { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px dashed var(--line); font-weight: 700; }
  .summary li:last-child { border-bottom: 0; }
  .summary .e { font-size: 1.4rem; line-height: 1.2; }
  .summary .note-text { font-weight: 600; font-style: italic; }
  .love {
    font-family: "Dancing Script", cursive; font-weight: 700; color: var(--primary);
    font-size: clamp(3rem, 12vw, 5rem); margin: 22px 0 0; animation: beat 1.3s ease-in-out infinite;
  }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.12); } 30% { transform: scale(1); } 45% { transform: scale(1.08); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ===== 1) Otázka ===== -->
<section class="screen active" id="s1">
  <div class="card">
    <svg class="dog" viewBox="0 -8 120 148" aria-hidden="true">
      <use href="#yorkie" width="120" height="140"/>
      <use href="#bow" x="42" y="-8" width="36" height="18" color="#ff4f8b"/>
    </svg>
    <h1>Půjdeš se mnou na rande?</h1>
    <div class="answers">
      <button class="btn" id="yes">Ano 💖</button>
      <button class="btn" id="no">Ne</button>
    </div>
  </div>
</section>

<!-- ===== 2) Co dělat ===== -->
<section class="screen" id="s2">
  <div class="card">
    <h2>A co bys ráda dělala?</h2>
    <div class="options" id="options"></div>
  </div>
  <div class="bar"><span class="spacer"></span><button class="btn" id="to3" disabled>Další ➜</button></div>
</section>

<!-- ===== 3) Kdy ===== -->
<section class="screen" id="s3">
  <div class="card">
    <h2>Kdy se ti to hodí?</h2>
    <div class="date-grid">
      <div class="cal">
        <div class="cal-head">
          <button id="prevM" aria-label="Předchozí měsíc">‹</button>
          <span id="monthLabel"></span>
          <button id="nextM" aria-label="Další měsíc">›</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <label class="note">Poznámka 💌
        <textarea id="note" placeholder="Třeba čas, co si vzít na sebe, nebo cokoliv mi chceš vzkázat…"></textarea>
      </label>
    </div>
    <p class="hint" id="dateHint">Vyber v kalendáři den 📅</p>
  </div>
  <div class="bar">
    <button class="btn ghost" id="back2">← Zpět</button>
    <button class="btn" id="send" disabled>Odeslat 💌</button>
  </div>
</section>

<!-- ===== 4) Shrnutí ===== -->
<section class="screen" id="s4">
  <div class="card">
    <h2>Super! Těším se na…</h2>
    <ul class="summary" id="summary"></ul>
    <p class="love">Miluju tě ❤️</p>
  </div>
</section>

<script>
/* ===== Možnosti – uprav/přidej tady (a = tvar pro „Těším se na …“) ===== */
const OPTIONS = [
  { e: "🔐", t: "Únikovka",             a: "únikovku" },
  { e: "🍿", t: "Večerní film doma",    a: "večerní film doma" },
  { e: "🛁", t: "Vířivka",              a: "vířivku" },
  { e: "🎬", t: "Kino",                 a: "kino" },
  { e: "🍝", t: "Večeře",               a: "večeři" },
  { e: "🎢", t: "Adrenalinový zážitek", a: "adrenalinový zážitek" },
  { e: "🐶", t: "Procházka s Ashley",   a: "procházku s Ashley" },
];
const EMAIL = "minsck@seznam.cz";      // sem přijde její odpověď (FormSubmit.co)
const NO_GROW = 5, NO_TOTAL = 10;   // 5× se zvětší Ano, pak 5× Ne uhne a zmenšuje se, pak zmizí

const $ = id => document.getElementById(id);
const show = id => {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  scrollTo(0, 0);
};

/* Vlastní pozadí, pokud existuje pozadi.jpg */
const bg = new Image();
bg.onload = () => document.body.classList.add("custom-bg");
bg.src = "pozadi.jpg";

/* Padající srdíčka */
const scene = $("scene");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function heart(big) {
  const h = document.createElement("span");
  h.className = "float-heart";
  h.textContent = ["💗", "💖", "💕", "❤️", "🌸"][Math.random() * 5 | 0];
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (big ? 24 : 14) + Math.random() * 20 + "px";
  h.style.animationDuration = (big ? 3 : 8) + Math.random() * 6 + "s";
  scene.appendChild(h);
  h.addEventListener("animationend", () => h.remove());
}
if (!reduced) setInterval(() => heart(false), 900);
const burst = n => { if (!reduced) for (let i = 0; i < n; i++) setTimeout(() => heart(true), i * 60); };

/* ===== 1) Ano / Ne ===== */
const yes = $("yes"), no = $("no");
let noCount = 0;
function onNo(e) {
  e.preventDefault();
  if (no.classList.contains("gone")) return;
  noCount++;
  if (noCount <= NO_GROW) {
    yes.style.fontSize = `min(${1.25 * (1 + noCount * 0.35)}rem, 13vw)`;
    return;
  }
  if (noCount >= NO_TOTAL) { no.classList.add("gone"); setTimeout(() => no.remove(), 400); return; }
  const scale = 1 - (noCount - NO_GROW) / (NO_TOTAL - NO_GROW + 1);
  const r = no.getBoundingClientRect();
  if (!no.classList.contains("moving")) {   // přesun do <body>: .card má backdrop-filter a fixed by se počítal od ní
    no.classList.add("moving");
    no.style.left = r.left + "px"; no.style.top = r.top + "px";
    document.body.appendChild(no); no.offsetWidth;
  }
  const y = yes.getBoundingClientRect(), pad = 16;
  let x, t, tries = 0;
  do {
    x = pad + Math.random() * (innerWidth - r.width - pad * 2);
    t = pad + Math.random() * (innerHeight - r.height - pad * 2);
  } while (tries++ < 30 && x < y.right + 20 && x + r.width > y.left - 20 && t < y.bottom + 20 && t + r.height > y.top - 20);
  no.style.left = x + "px";
  no.style.top = t + "px";
  no.style.transform = `scale(${scale})`;
}
let lastPtr = 0;
no.addEventListener("pointerdown", e => { lastPtr = e.timeStamp; onNo(e); });
no.addEventListener("pointerenter", e => { if (e.pointerType === "mouse" && noCount >= NO_GROW) { lastPtr = e.timeStamp; onNo(e); } });
no.addEventListener("click", e => { if (e.timeStamp - lastPtr > 800) onNo(e); });   // klávesnice
yes.addEventListener("click", () => { if (no.isConnected) no.remove(); burst(25); show("s2"); });

/* ===== 2) Aktivity ===== */
const optBox = $("options"), to3 = $("to3");
const selected = new Set();
function optCard(o, custom) {
  const b = document.createElement("button");
  b.className = "opt";
  b.innerHTML = `<span class="e">${o.e}</span><span></span>`;
  b.lastChild.textContent = o.t;
  b.addEventListener("click", () => {
    selected.has(o) ? selected.delete(o) : selected.add(o);
    b.classList.toggle("on", selected.has(o));
    to3.disabled = !selected.size;
  });
  if (custom) {
    const d = document.createElement("span");
    d.className = "del"; d.textContent = "×"; d.title = "Odebrat";
    d.addEventListener("click", ev => { ev.stopPropagation(); selected.delete(o); b.remove(); to3.disabled = !selected.size; });
    b.appendChild(d);
  }
  return b;
}
OPTIONS.forEach(o => optBox.appendChild(optCard(o)));

const add = document.createElement("div");
add.className = "opt add"; add.tabIndex = 0; add.setAttribute("role", "button");
const addIdle = () => { add.innerHTML = `<span class="e">➕</span><span>Vlastní možnost</span>`; add.dataset.edit = ""; };
addIdle();
optBox.appendChild(add);
function addEdit() {
  if (add.dataset.edit) return;
  add.dataset.edit = "1";
  add.innerHTML = `<input maxlength="40" placeholder="Napiš co…"><button class="btn ok">Přidat</button>`;
  const inp = add.querySelector("input");
  const commit = () => {
    const t = inp.value.trim();
    if (t) {
      const o = { e: "💫", t, a: t.charAt(0).toLowerCase() + t.slice(1) };
      const c = optCard(o, true);
      optBox.insertBefore(c, add);
      c.click();
    }
    addIdle();
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(); if (e.key === "Escape") addIdle(); });
  inp.addEventListener("blur", () => setTimeout(() => { if (add.dataset.edit && !add.contains(document.activeElement)) commit(); }, 150));
  add.querySelector(".ok").addEventListener("click", e => { e.stopPropagation(); commit(); });
  inp.focus();
}
add.addEventListener("click", addEdit);
add.addEventListener("keydown", e => { if (e.target === add && e.key === "Enter") addEdit(); });
to3.addEventListener("click", () => show("s3"));

/* ===== 3) Kalendář ===== */
const MONTHS = ["leden","únor","březen","duben","květen","červen","červenec","srpen","září","říjen","listopad","prosinec"];
const MONTHS_GEN = ["ledna","února","března","dubna","května","června","července","srpna","září","října","listopadu","prosince"];
const DAYS_ACC = ["v neděli","v pondělí","v úterý","ve středu","ve čtvrtek","v pátek","v sobotu"];
const today = new Date(); today.setHours(0, 0, 0, 0);
let view = new Date(today.getFullYear(), today.getMonth(), 1), picked = null;

function renderCal() {
  $("monthLabel").textContent = `${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
  $("prevM").disabled = view <= new Date(today.getFullYear(), today.getMonth(), 1);
  const g = $("calGrid");
  g.innerHTML = ["Po","Út","St","Čt","Pá","So","Ne"].map(d => `<span class="wd">${d}</span>`).join("");
  const offset = (view.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) g.appendChild(document.createElement("span"));
  const len = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
  for (let d = 1; d <= len; d++) {
    const date = new Date(view.getFullYear(), view.getMonth(), d);
    const b = document.createElement("button");
    b.className = "day"; b.textContent = d;
    b.disabled = date < today;
    if (+date === +today) b.classList.add("today");
    if (picked && +date === +picked) b.classList.add("sel");
    b.addEventListener("click", () => {
      picked = date; renderCal();
      $("send").disabled = false;
      $("dateHint").textContent = `Vybráno: ${fmtDate(date)} 💕`;
    });
    g.appendChild(b);
  }
}
const fmtDate = d => `${DAYS_ACC[d.getDay()]} ${d.getDate()}. ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
$("prevM").addEventListener("click", () => { view.setMonth(view.getMonth() - 1); renderCal(); });
$("nextM").addEventListener("click", () => { view.setMonth(view.getMonth() + 1); renderCal(); });
renderCal();
$("back2").addEventListener("click", () => show("s2"));

/* ===== 4) Shrnutí ===== */
$("send").addEventListener("click", () => {
  const ul = $("summary");
  ul.innerHTML = "";
  const li = (e, text, cls) => {
    const l = document.createElement("li");
    l.innerHTML = `<span class="e">${e}</span><span></span>`;
    l.lastChild.textContent = text;
    if (cls) l.lastChild.className = cls;
    ul.appendChild(l);
  };
  selected.forEach(o => li(o.e, o.a));
  li("📅", fmtDate(picked));
  const note = $("note").value.trim();
  if (note) li("💌", `„${note}“`, "note-text");
  show("s4");
  burst(40);
  sendMail({
    _subject: "💖 Odpověď na rande",
    _template: "table",
    _captcha: "false",
    "Co": [...selected].map(o => o.t).join(", "),
    "Kdy": fmtDate(picked),
    "Poznámka": note || "—",
  });
});

/* Odeslání e-mailem; při chybě jeden pokus znovu */
function sendMail(data, retry = true) {
  fetch(`https://formsubmit.co/ajax/${EMAIL}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify(data),
  }).then(r => { if (!r.ok) throw r; })
    .catch(() => { if (retry) setTimeout(() => sendMail(data, false), 3000); });
}
